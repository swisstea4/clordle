<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clordle</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/data/nonwordles.js" defer></script>
    <script src="/data/wordles.js" defer></script>
    <script src="/main.js" defer></script>
</head>
<body>
    <div id="centering">
        <div id="allattempts">
            <div id="attempt1" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a11">
                <input class="inputs" type="text" maxlength="1" name="a12">
                <input class="inputs" type="text" maxlength="1" name="a13">
                <input class="inputs" type="text" maxlength="1" name="a14">
                <input class="inputs" type="text" maxlength="1" name="a15">
            </div>
            <div id="attempt2" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a21">
                <input class="inputs" type="text" maxlength="1" name="a22">
                <input class="inputs" type="text" maxlength="1" name="a23">
                <input class="inputs" type="text" maxlength="1" name="a24">
                <input class="inputs" type="text" maxlength="1" name="a25">
            </div>
            <div id="attempt3" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a31">
                <input class="inputs" type="text" maxlength="1" name="a32">
                <input class="inputs" type="text" maxlength="1" name="a33">
                <input class="inputs" type="text" maxlength="1" name="a34">
                <input class="inputs" type="text" maxlength="1" name="a35">
            </div>
            <div id="attempt4" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a41">
                <input class="inputs" type="text" maxlength="1" name="a42">
                <input class="inputs" type="text" maxlength="1" name="a43">
                <input class="inputs" type="text" maxlength="1" name="a44">
                <input class="inputs" type="text" maxlength="1" name="a45">
            </div>
            <div id="attempt5" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a51">
                <input class="inputs" type="text" maxlength="1" name="a52">
                <input class="inputs" type="text" maxlength="1" name="a53">
                <input class="inputs" type="text" maxlength="1" name="a54">
                <input class="inputs" type="text" maxlength="1" name="a55">
            </div>
            <div id="attempt6" class="attempts">
                <input class="inputs" type="text" maxlength="1" name="a61">
                <input class="inputs" type="text" maxlength="1" name="a62">
                <input class="inputs" type="text" maxlength="1" name="a63">
                <input class="inputs" type="text" maxlength="1" name="a64">
                <input class="inputs" type="text" maxlength="1" name="a65">
            </div>
        </div>
        <div id="allmessages"></div>
        <div id="keyboard">
            <div id="KBrow1">
                <button id="keyQ" class="letterKeys allKeys">Q</button>
                <button id="keyW" class="letterKeys allKeys">W</button>
                <button id="keyE" class="letterKeys allKeys">E</button>
                <button id="keyR" class="letterKeys allKeys">R</button>
                <button id="keyT" class="letterKeys allKeys">T</button>
                <button id="keyY" class="letterKeys allKeys">Y</button>
                <button id="keyU" class="letterKeys allKeys">U</button>
                <button id="keyI" class="letterKeys allKeys">I</button>
                <button id="keyO" class="letterKeys allKeys">O</button>
                <button id="keyP" class="letterKeys allKeys">P</button>
            </div>
            <div id="KBrow2">
                <button id="keyA" class="letterKeys allKeys">A</button>
                <button id="keyS" class="letterKeys allKeys">S</button>
                <button id="keyD" class="letterKeys allKeys">D</button>
                <button id="keyF" class="letterKeys allKeys">F</button>
                <button id="keyG" class="letterKeys allKeys">G</button>
                <button id="keyH" class="letterKeys allKeys">H</button>
                <button id="keyJ" class="letterKeys allKeys">J</button>
                <button id="keyK" class="letterKeys allKeys">K</button>
                <button id="keyL" class="letterKeys allKeys">L</button>
            </div>
            <div id="KBrow3">
                <button id="keyEnter" class="allKeys">ENTER</button>
                <button id="keyZ" class="letterKeys allKeys">Z</button>
                <button id="keyX" class="letterKeys allKeys">X</button>
                <button id="keyC" class="letterKeys allKeys">C</button>
                <button id="keyV" class="letterKeys allKeys">V</button>
                <button id="keyB" class="letterKeys allKeys">B</button>
                <button id="keyN" class="letterKeys allKeys">N</button>
                <button id="keyM" class="letterKeys allKeys">M</button>
                <button id="keyBackspace" class="allKeys"><img src="/data/backspace.png"></button>
            </div>
        </div>
    </div>
    <div id="wingame">
        <p id="wintitle">GUESSED IN</p>
        <p id="winattempts"> attempts</p>
        <div id="winbuttons">
            <button id="winplayagain">PLAY AGAIN</button>
            <button id="winshare">SHARE</button>
        </div>
    </div>
    <div id="losegame">
        <p id="losetitle">THE WORD WAS</p>
        <p id="loseword"></p>
        <div id="losebuttons">
            <button id="loseplayagain">PLAY AGAIN</button>
            <button id="loseshare">SHARE</button>
        </div>

    </div>
</body>
